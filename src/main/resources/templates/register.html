<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="https://www.thymeleaf.org">
    <head>
        <title>Spring Security Register</title>
    </head>
    <body>
        <form th:action="@{/register}" method="post">
            <div><label for="username"> User Name: <input type="text" id="username" name="username"></label></div>
            <div><label for="password"> Password: <input type="password" id="password" name="password"></label></div>
            <div><label for="confirmPassword"> Confirm Password: <input type="password" id="confirmPassword" name="confirmPassword"></label></div>
            <div><input type="submit" value="Register"/></div>
        </form>
        
    </body>
</html>
