<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 – Page Not Found</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      height: 100vh;
      background: #ffffff;
      color: #000000;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .container {
      max-width: 500px;
      padding: 40px;
    }

    h1 {
      font-size: 6rem;
      font-weight: 800;
      letter-spacing: 4px;
    }

    h2 {
      margin: 10px 0;
      font-size: 1.5rem;
      font-weight: 500;
    }

    p {
      margin: 20px 0;
      color: #333333;
      line-height: 1.6;
    }

    a {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 28px;
      border: 2px solid #000;
      color: #000;
      text-decoration: none;
      border-radius: 30px;
      font-weight: 600;
      transition: all 0.2s ease;
    }

    a:hover {
      background: #000;
      color: #fff;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>404</h1>
    <h2>Page Not Found</h2>
    <p>
      Sorry, the page you’re looking for doesn’t exist or has been moved.
    </p>
    <a href="/">Back to Home</a>
  </div>
</body>
</html>
